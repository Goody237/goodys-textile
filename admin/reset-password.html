<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your Goodys Textile administrator password.">
  <title>Reset Password · Goodys Textile Admin</title>
  <link rel="stylesheet" href="dashboard.css">
  <script type="module" src="reset-password.js"></script>
</head>
<body>
  <main class="auth-gate" aria-labelledby="resetTitle">
    <section class="auth-card">
      <a class="brand auth-brand" href="../index.html" aria-label="Goodys Textile storefront">
        <span class="brand-mark" aria-hidden="true">GT</span>
        <span class="brand-copy"><strong>Goodys</strong><small>TEXTILE · ADMIN</small></span>
      </a>
      <p class="eyebrow">SECURE ACCOUNT RECOVERY</p>
      <h1 id="resetTitle">Reset your password</h1>
      <p class="auth-description" id="resetDescription">Verifying your password recovery link…</p>
      <p class="auth-message" id="resetMessage" role="status" aria-live="polite">Please wait.</p>

      <form class="auth-form" id="resetForm" hidden>
        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">Confirm new password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button class="button button-primary" id="updatePasswordButton" type="submit">Update password</button>
      </form>

      <div id="resetSuccessActions" hidden>
        <a class="button button-primary" href="dashboard.html">Return to dashboard sign-in</a>
      </div>

      <a class="storefront-link auth-storefront-link" href="dashboard.html">← Back to admin sign-in</a>
    </section>
  </main>
</body>
</html>
